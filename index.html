<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173b32">
  <link rel="icon" href="data:,">
  <title>拼豆库存管理</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17201d;
      --muted: #66716d;
      --surface: #ffffff;
      --surface-soft: #f1f4f1;
      --canvas: #e9eeeb;
      --line: #ccd5d0;
      --line-strong: #aebbb5;
      --brand: #176b53;
      --brand-strong: #0f503e;
      --brand-soft: #dceee7;
      --warning: #a86612;
      --warning-soft: #fff3d9;
      --danger: #b4232e;
      --danger-strong: #8f1822;
      --danger-soft: #fde8ea;
      --focus: #d59219;
      --shadow: 0 1px 2px rgba(23, 32, 29, 0.07), 0 8px 24px rgba(23, 32, 29, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--canvas);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 0;
      min-height: 100vh;
      background: var(--canvas);
      color: var(--ink);
      font-family: "Microsoft YaHei UI", "PingFang SC", system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
      letter-spacing: 0;
    }

    button,
    select,
    input[type="number"],
    input[type="search"] {
      min-height: 44px;
    }

    button,
    summary,
    label,
    select,
    input[type="checkbox"] {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    summary:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 55%, transparent);
      outline-offset: 2px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .app-header {
      background: #173b32;
      color: #ffffff;
      border-bottom: 4px solid #d69a2d;
    }

    .header-inner,
    .app-shell {
      width: min(1480px, 100%);
      margin: 0 auto;
      padding-inline: clamp(14px, 3vw, 32px);
    }

    .header-inner {
      display: grid;
      gap: 18px;
      padding-block: 22px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .sync-status {
      min-height: 40px;
      margin-left: auto;
      padding: 7px 11px;
      border: 1px solid rgba(255, 255, 255, 0.36);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .sync-status:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .brand-mark {
      display: grid;
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      padding: 5px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
    }

    .brand-mark span {
      border-radius: 50%;
      background: #f3ce4d;
    }

    .brand-mark span:nth-child(2n) {
      background: #ee7789;
    }

    .brand-mark span:nth-child(3n) {
      background: #67c8d4;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-copy p {
      margin: 0 0 2px;
      color: #b9d8cd;
      font-size: 13px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 30px);
      line-height: 1.2;
      letter-spacing: 0;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .stat {
      min-width: 0;
      padding: 11px 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
    }

    .stat-label {
      display: block;
      color: #cfe2dc;
      font-size: 12px;
      white-space: nowrap;
    }

    .stat-value {
      display: block;
      margin-top: 1px;
      overflow: hidden;
      font-size: clamp(19px, 4vw, 26px);
      font-weight: 800;
      line-height: 1.2;
      text-overflow: ellipsis;
    }

    .stat.is-warning .stat-value {
      color: #ffd06e;
    }

    .app-shell {
      padding-block: 18px 32px;
    }

    .notice {
      margin-bottom: 14px;
      padding: 11px 14px;
      border: 1px solid #d8a240;
      border-radius: 8px;
      background: var(--warning-soft);
      color: #714509;
      font-weight: 700;
    }

    .notice[hidden] {
      display: none;
    }

    .layout {
      display: grid;
      min-width: 0;
      gap: 14px;
    }

    .tools-column {
      display: grid;
      min-width: 0;
      align-content: start;
      gap: 12px;
    }

    .panel {
      min-width: 0;
      overflow: clip;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .panel > summary {
      position: relative;
      display: flex;
      min-height: 54px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 44px 13px 16px;
      list-style: none;
      font-weight: 800;
      user-select: none;
    }

    .panel > summary::-webkit-details-marker {
      display: none;
    }

    .panel > summary::after {
      position: absolute;
      right: 16px;
      content: "+";
      color: var(--brand);
      font-size: 22px;
      font-weight: 500;
      line-height: 1;
    }

    .panel[open] > summary::after {
      content: "−";
    }

    .summary-meta {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .panel-body {
      min-width: 0;
      padding: 0 14px 16px;
      border-top: 1px solid var(--line);
    }

    .inventory-panel .panel-body {
      padding-top: 14px;
    }

    .inventory-toolbar {
      display: grid;
      min-width: 0;
      gap: 10px;
      margin-bottom: 14px;
    }

    .search-wrap {
      position: relative;
      min-width: 0;
    }

    .search-wrap::before {
      position: absolute;
      top: 50%;
      left: 14px;
      width: 14px;
      height: 14px;
      transform: translateY(-58%);
      border: 2px solid var(--muted);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    .search-wrap::after {
      position: absolute;
      top: calc(50% + 5px);
      left: 27px;
      width: 7px;
      height: 2px;
      transform: rotate(45deg);
      background: var(--muted);
      content: "";
      pointer-events: none;
    }

    .field,
    .search-input {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
    }

    .search-input {
      padding: 10px 12px 10px 42px;
    }

    .field {
      min-height: 44px;
      padding: 9px 11px;
    }

    .field:hover,
    .search-input:hover {
      border-color: #7c8e86;
    }

    .group-filter,
    .group-actions,
    .inline-actions {
      display: flex;
      min-width: 0;
      flex-wrap: wrap;
      gap: 7px;
    }

    .filter-btn,
    .group-btn,
    .btn {
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      font-weight: 700;
    }

    .filter-btn,
    .group-btn {
      min-height: 44px;
      padding: 7px 12px;
    }

    .filter-btn[aria-pressed="true"] {
      border-color: var(--brand);
      background: var(--brand-soft);
      color: var(--brand-strong);
    }

    .group-btn:hover,
    .filter-btn:hover {
      border-color: var(--brand);
    }

    .inventory-grid {
      display: grid;
      min-width: 0;
      grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
      gap: 8px;
    }

    .bead-card {
      display: grid;
      min-width: 0;
      min-height: 78px;
      grid-template-columns: 40px minmax(0, 1fr);
      grid-template-rows: auto auto;
      align-content: center;
      gap: 2px 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
    }

    .bead-card:hover {
      border-color: #91a198;
      background: #fbfcfb;
    }

    .swatch {
      width: 40px;
      height: 40px;
      grid-row: 1 / 3;
      align-self: center;
      border: 1px solid rgba(23, 32, 29, 0.28);
      border-radius: 6px;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.24);
    }

    .color-code {
      overflow: hidden;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stock-line {
      display: flex;
      min-width: 0;
      align-items: baseline;
      gap: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .quantity {
      color: var(--ink);
      font-size: 17px;
      font-weight: 800;
    }

    .low-label {
      display: none;
      overflow: hidden;
      color: var(--danger);
      font-size: 11px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bead-card.is-low {
      border-color: #edb6bb;
      background: #fffafb;
    }

    .bead-card.is-low .quantity,
    .bead-card.is-low .low-label {
      display: inline;
      color: var(--danger);
    }

    .empty-state {
      padding: 36px 16px;
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
    }

    .form-section {
      display: grid;
      min-width: 0;
      gap: 12px;
      padding-top: 14px;
    }

    .field-group {
      display: grid;
      min-width: 0;
      gap: 6px;
    }

    .field-label,
    .section-label {
      font-size: 13px;
      font-weight: 800;
    }

    .section-label {
      margin: 0;
      color: var(--muted);
    }

    .usage-list {
      display: grid;
      gap: 8px;
    }

    .usage-meta {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
    }

    .usage-code-control {
      display: grid;
      grid-template-columns: minmax(0, 0.45fr) minmax(0, 0.8fr) minmax(0, 1fr);
      gap: 6px;
      align-items: end;
    }

    .legacy-code-select {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .usage-code-control .usage-code-number {
      min-width: 0;
    }

    .usage-swatch {
      width: 44px;
      height: 44px;
      border: 1px solid rgba(23, 32, 29, 0.28);
      border-radius: 6px;
      background: var(--surface-soft);
    }

    .usage-image-preview {
      display: none;
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 6px;
      object-fit: cover;
    }

    .usage-image-preview.is-visible {
      display: block;
    }

    .usage-image-status {
      color: var(--muted);
      font-size: 12px;
      min-height: 16px;
    }

    .usage-row {
      display: grid;
      min-width: 0;
      grid-template-columns: minmax(0, 1fr) minmax(88px, 0.72fr) 44px;
      gap: 7px;
      align-items: end;
    }

    .usage-row .field-group {
      gap: 4px;
    }

    .usage-row .field-label {
      overflow: hidden;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid #e5b9bd;
      border-radius: 6px;
      background: #fff7f8;
      color: var(--danger);
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
    }

    .icon-btn:hover {
      border-color: var(--danger);
      background: var(--danger-soft);
    }

    .btn {
      min-height: 44px;
      padding: 9px 14px;
    }

    .btn:hover {
      border-color: #7c8e86;
      background: var(--surface-soft);
    }

    .btn-primary {
      border-color: var(--brand);
      background: var(--brand);
      color: #ffffff;
    }

    .btn-primary:hover {
      border-color: var(--brand-strong);
      background: var(--brand-strong);
    }

    .btn-danger {
      border-color: var(--danger);
      background: #ffffff;
      color: var(--danger);
    }

    .btn-danger:hover {
      border-color: var(--danger-strong);
      background: var(--danger-soft);
    }

    .btn-block {
      width: 100%;
    }

    .selection-head {
      display: flex;
      min-width: 0;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .selected-count {
      color: var(--brand-strong);
      font-size: 13px;
      font-weight: 800;
    }

    .color-checks {
      display: grid;
      max-height: 310px;
      min-width: 0;
      grid-template-columns: repeat(auto-fill, minmax(82px, 1fr));
      gap: 6px;
      overflow: auto;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface-soft);
      scrollbar-gutter: stable;
    }

    .color-check {
      display: flex;
      min-width: 0;
      min-height: 44px;
      align-items: center;
      gap: 6px;
      padding: 6px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: #ffffff;
    }

    .color-check:has(input:checked) {
      border-color: var(--brand);
      background: var(--brand-soft);
    }

    .color-check input {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      accent-color: var(--brand);
    }

    .mini-swatch {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      border: 1px solid rgba(23, 32, 29, 0.28);
      border-radius: 4px;
    }

    .check-code {
      overflow: hidden;
      font-size: 12px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .form-message {
      display: none;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .form-message:not(:empty) {
      display: block;
    }

    .form-message.is-error {
      border: 1px solid #e8a9ae;
      background: var(--danger-soft);
      color: var(--danger-strong);
    }

    .shortage-list {
      display: grid;
      gap: 4px;
      margin: 8px 0 0;
      padding-left: 20px;
    }

    .data-actions {
      display: grid;
      gap: 8px;
    }

    .sync-settings {
      display: grid;
      gap: 10px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .sync-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .sync-fields .is-wide {
      grid-column: 1 / -1;
    }

    .conflict-list {
      display: grid;
      max-height: 50vh;
      gap: 10px;
      overflow: auto;
    }

    .conflict-row {
      display: grid;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .conflict-copy {
      margin: 0;
      overflow-wrap: anywhere;
      color: var(--muted);
      font-size: 12px;
    }

    .data-actions input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .data-actions label.btn {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .storage-note {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .history-panel {
      margin-top: 14px;
    }

    .history-list {
      display: grid;
      gap: 8px;
      padding-top: 14px;
    }

    .history-toolbar {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding-top: 14px;
    }

    .history-row {
      display: grid;
      min-width: 0;
      grid-template-columns: minmax(110px, 0.65fr) minmax(0, 1fr) auto auto;
      gap: 8px 14px;
      align-items: center;
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
    }

    .history-row:last-child {
      border-bottom: 0;
    }

    .history-title {
      font-weight: 800;
    }

    .history-image {
      width: 32px;
      height: 32px;
      margin-left: 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      object-fit: cover;
      vertical-align: middle;
    }

    .history-items,
    .history-time {
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .history-items {
      overflow-wrap: anywhere;
    }

    .history-actions {
      display: flex;
      gap: 6px;
    }

    .history-actions .btn {
      min-height: 40px;
      padding: 7px 10px;
      font-size: 13px;
    }

    .history-load-more {
      width: 100%;
      margin-top: 8px;
    }

    .history-edit-list {
      display: grid;
      gap: 8px;
    }

    .history-edit-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(110px, 0.75fr) 44px;
      gap: 8px;
      align-items: end;
    }

    .history-dialog {
      width: min(640px, calc(100% - 28px));
      max-height: calc(100vh - 28px);
      overflow: auto;
    }

    .history-empty {
      margin: 0;
      padding: 20px 4px 4px;
      color: var(--muted);
      text-align: center;
    }

    dialog {
      width: min(420px, calc(100% - 28px));
      padding: 0;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      color: var(--ink);
      box-shadow: 0 24px 70px rgba(23, 32, 29, 0.3);
    }

    dialog::backdrop {
      background: rgba(18, 27, 24, 0.58);
    }

    .dialog-body {
      padding: 20px;
    }

    .dialog-body h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .dialog-body p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .toast {
      position: fixed;
      z-index: 30;
      right: 16px;
      bottom: 16px;
      max-width: min(360px, calc(100% - 32px));
      padding: 11px 14px;
      transform: translateY(18px);
      border-radius: 8px;
      background: #173b32;
      color: #ffffff;
      box-shadow: 0 12px 35px rgba(23, 32, 29, 0.25);
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .toast.is-visible {
      transform: translateY(0);
      opacity: 1;
    }

    @media (min-width: 760px) {
      .header-inner {
        grid-template-columns: minmax(260px, 1fr) minmax(420px, 0.8fr);
        align-items: center;
      }

      .inventory-toolbar {
        grid-template-columns: minmax(240px, 0.58fr) minmax(0, 1fr);
        align-items: start;
      }

      .filter-btn,
      .group-btn {
        min-height: 44px;
      }
    }

    @media (min-width: 1040px) {
      .layout {
        grid-template-columns: minmax(0, 1fr) minmax(330px, 390px);
        align-items: start;
      }

      .inventory-grid {
        grid-template-columns: repeat(auto-fill, minmax(142px, 1fr));
      }
    }

    @media (max-width: 480px) {
      .header-inner {
        padding-block: 16px;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        flex-basis: 42px;
      }

      .stat {
        padding: 9px 8px;
      }

      .stat-label {
        overflow: hidden;
        font-size: 11px;
        text-overflow: ellipsis;
      }

      .panel > summary {
        min-height: 58px;
      }

      .inventory-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .bead-card {
        min-height: 84px;
        grid-template-columns: 42px minmax(0, 1fr);
      }

      .swatch {
        width: 42px;
        height: 42px;
      }

      .usage-row {
        grid-template-columns: minmax(0, 1fr) 44px;
      }

      .usage-row .quantity-field {
        grid-column: 1 / 2;
      }

      .usage-row .remove-usage-row {
        grid-column: 2;
        grid-row: 1 / 3;
        align-self: end;
      }

      .dialog-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .history-row {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .history-items {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .history-time {
        grid-column: 1;
      }

      .history-actions {
        grid-column: 2;
      }

      .history-toolbar {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .history-edit-row {
        grid-template-columns: minmax(0, 1fr) 44px;
      }

      .history-edit-row .history-edit-quantity {
        grid-column: 1;
      }

      .history-edit-row .remove-history-item {
        grid-column: 2;
        grid-row: 1 / 3;
      }

      .sync-fields {
        grid-template-columns: 1fr;
      }

      .sync-fields .is-wide {
        grid-column: auto;
      }

      .usage-meta {
        grid-template-columns: 1fr;
      }

      .usage-code-control {
        grid-template-columns: minmax(0, 0.5fr) minmax(0, 0.75fr) 44px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-row">
        <span class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </span>
        <div class="brand-copy">
          <p>豆仓</p>
          <h1>拼豆库存管理</h1>
        </div>
        <button class="sync-status" id="sync-status" type="button" aria-live="polite">未配置同步</button>
      </div>
      <div class="stats" aria-label="库存统计">
        <div class="stat">
          <span class="stat-label">库存总数</span>
          <strong class="stat-value" id="total-stock">0</strong>
        </div>
        <div class="stat is-warning">
          <span class="stat-label">库存不足</span>
          <strong class="stat-value" id="low-stock-count">282</strong>
        </div>
        <div class="stat">
          <span class="stat-label">色号数量</span>
          <strong class="stat-value" id="color-count">282</strong>
        </div>
      </div>
    </div>
  </header>

  <main class="app-shell">
    <div class="notice" id="storage-notice" role="alert" hidden></div>
    <div class="layout">
      <details class="panel inventory-panel" id="inventory-panel" open>
        <summary>
          <span>库存总览</span>
          <span class="summary-meta" id="visible-count">282 个色号</span>
        </summary>
        <div class="panel-body">
          <div class="inventory-toolbar">
            <label class="search-wrap" for="color-search">
              <span class="sr-only" hidden>搜索色号</span>
              <input class="search-input" id="color-search" type="search" inputmode="search" autocomplete="off" placeholder="搜索色号，例如 A2" aria-label="搜索色号">
            </label>
            <div class="group-filter" id="group-filter" aria-label="按色系筛选"></div>
          </div>
          <div class="inventory-grid" id="inventory-grid"></div>
          <div class="empty-state" id="inventory-empty" hidden>没有匹配的色号</div>
        </div>
      </details>

      <aside class="tools-column" aria-label="库存操作">
        <details class="panel" id="usage-panel">
          <summary>
            <span>图纸消耗扣减</span>
            <span class="summary-meta">批量录入</span>
          </summary>
          <div class="panel-body">
            <form class="form-section" id="usage-form" novalidate>
              <div class="usage-meta">
                <div class="field-group">
                  <label class="field-label" for="usage-label">图纸名称（可选）</label>
                  <input class="field" id="usage-label" maxlength="80" autocomplete="off" placeholder="例如：小兔图纸">
                </div>
                <div class="field-group">
                  <label class="field-label" for="usage-image">图纸图片（可选）</label>
                  <input class="field" id="usage-image" type="file" accept="image/*">
                </div>
              </div>
              <div class="usage-image-status" id="usage-image-status" aria-live="polite"></div>
              <div class="usage-list" id="usage-list"></div>
              <button class="btn" id="add-usage-row" type="button">＋ 添加一行</button>
              <div class="form-message" id="usage-message" role="alert" tabindex="-1"></div>
              <button class="btn btn-primary btn-block" type="submit">确认扣减</button>
            </form>
          </div>
        </details>

        <details class="panel" id="purchase-panel">
          <summary>
            <span>采购入库</span>
            <span class="summary-meta">色系批量</span>
          </summary>
          <div class="panel-body">
            <form class="form-section" id="purchase-form" novalidate>
              <div class="field-group">
                <p class="section-label">选择色系</p>
                <div class="group-actions" id="purchase-group-actions"></div>
              </div>
              <div class="selection-head">
                <span class="selected-count" id="selected-count">已选择 0 个色号</span>
                <div class="inline-actions">
                  <button class="filter-btn" id="select-all" type="button">全选</button>
                  <button class="filter-btn" id="clear-selection" type="button">清空选择</button>
                </div>
              </div>
              <div class="color-checks" id="color-checks" aria-label="选择单个色号"></div>
              <div class="field-group">
                <label class="field-label" for="purchase-quantity">每个色号入库数量</label>
                <input class="field" id="purchase-quantity" type="number" min="1" max="9007199254740991" step="1" inputmode="numeric" placeholder="输入颗数" required>
              </div>
              <div class="form-message" id="purchase-message" role="alert" tabindex="-1"></div>
              <button class="btn btn-primary btn-block" type="submit">确认入库</button>
            </form>
          </div>
        </details>

        <details class="panel" id="data-panel">
          <summary>
            <span>数据管理</span>
            <span class="summary-meta">备份与恢复</span>
          </summary>
          <div class="panel-body">
            <div class="form-section data-actions">
              <button class="btn" id="export-backup" type="button">导出 JSON 备份</button>
              <label class="btn" for="import-file">导入 JSON 备份</label>
              <input id="import-file" type="file" accept="application/json,.json">
              <button class="btn btn-danger" id="clear-inventory" type="button">清空全部库存</button>
              <div class="field-group">
                <label class="field-label" for="low-stock-threshold">库存不足阈值（少于此数量时报警）</label>
                <div class="inline-actions">
                  <input class="field" id="low-stock-threshold" type="number" min="0" max="9007199254740991" step="1" inputmode="numeric" required>
                  <button class="btn" id="save-threshold" type="button">保存阈值</button>
                </div>
              </div>
              <div class="sync-settings">
                <p class="section-label">GitHub 私有仓库同步</p>
                <div class="sync-fields">
                  <div class="field-group">
                    <label class="field-label" for="sync-owner">仓库所有者</label>
                    <input class="field" id="sync-owner" autocomplete="username">
                  </div>
                  <div class="field-group">
                    <label class="field-label" for="sync-repo">仓库名称</label>
                    <input class="field" id="sync-repo" autocomplete="off">
                  </div>
                  <div class="field-group is-wide">
                    <label class="field-label" for="sync-path">数据文件路径</label>
                    <input class="field" id="sync-path" value="perler-bead-data.json" autocomplete="off">
                  </div>
                  <div class="field-group is-wide">
                    <label class="field-label" for="sync-token">Fine-grained Token</label>
                    <input class="field" id="sync-token" type="password" autocomplete="new-password">
                  </div>
                </div>
                <div class="inline-actions">
                  <button class="btn" id="test-sync" type="button">测试连接</button>
                  <button class="btn btn-primary" id="save-sync" type="button">保存设置</button>
                  <button class="btn" id="sync-now" type="button">立即同步</button>
                  <button class="btn btn-danger" id="disconnect-sync" type="button">断开此设备</button>
                </div>
                <div class="form-message" id="sync-message" role="status" aria-live="polite" tabindex="-1"></div>
              </div>
              <p class="storage-note">库存优先保存在当前浏览器中</p>
              <div class="form-message" id="data-message" role="alert" tabindex="-1"></div>
            </div>
          </div>
        </details>
      </aside>
    </div>

    <details class="panel history-panel" id="history-panel">
      <summary>
        <span>操作历史</span>
        <span class="summary-meta" id="history-count">0 条记录</span>
      </summary>
      <div class="panel-body">
        <div class="history-toolbar" aria-label="历史筛选">
          <select class="field" id="history-type-filter" aria-label="按操作类型筛选">
            <option value="ALL">全部类型</option>
            <option value="opening">期初库存</option>
            <option value="purchase">采购入库</option>
            <option value="consume">图纸消耗</option>
            <option value="adjustment">库存调整</option>
          </select>
          <select class="field" id="history-code-filter" aria-label="按色号筛选">
            <option value="ALL">全部色号</option>
          </select>
          <input class="field" id="history-start-date" type="date" aria-label="开始日期">
          <input class="field" id="history-end-date" type="date" aria-label="结束日期">
        </div>
        <div class="form-message" id="history-message" role="alert" tabindex="-1"></div>
        <div class="history-list" id="history-list"></div>
        <p class="history-empty" id="history-empty">暂无操作记录</p>
        <button class="btn history-load-more" id="history-load-more" type="button" hidden>加载更多</button>
      </div>
    </details>
  </main>

  <dialog class="history-dialog" id="history-dialog" aria-labelledby="history-dialog-title">
    <form class="dialog-body form-section" id="history-form" novalidate>
      <h2 id="history-dialog-title">修改历史记录</h2>
      <div class="field-group">
        <label class="field-label" for="history-label">记录名称</label>
        <input class="field" id="history-label" maxlength="80" required>
      </div>
      <div class="field-group">
        <label class="field-label" for="history-type">操作类型</label>
        <select class="field" id="history-type">
          <option value="opening">期初库存</option>
          <option value="purchase">采购入库</option>
          <option value="consume">图纸消耗</option>
          <option value="adjustment">库存调整</option>
        </select>
      </div>
      <div class="field-group">
        <label class="field-label" for="history-occurred-at">发生时间</label>
        <input class="field" id="history-occurred-at" type="datetime-local" required>
      </div>
      <div class="history-edit-list" id="history-edit-items"></div>
      <button class="btn" id="add-history-item" type="button">＋ 添加色号</button>
      <div class="form-message" id="history-dialog-message" role="alert" tabindex="-1"></div>
      <div class="dialog-actions">
        <button class="btn" id="cancel-history" type="button">取消</button>
        <button class="btn btn-primary" id="save-history" type="submit">保存修改</button>
      </div>
    </form>
  </dialog>

  <dialog id="first-sync-dialog" aria-labelledby="first-sync-title">
    <div class="dialog-body">
      <h2 id="first-sync-title">选择首次同步方式</h2>
      <p id="first-sync-summary"></p>
      <div class="dialog-actions">
        <button class="btn" type="button" data-first-sync-choice="cloud">使用云端</button>
        <button class="btn" type="button" data-first-sync-choice="local">使用本地</button>
        <button class="btn btn-primary" type="button" data-first-sync-choice="merge">合并两边</button>
        <button class="btn" type="button" data-first-sync-choice="cancel">取消</button>
      </div>
    </div>
  </dialog>

  <dialog class="history-dialog" id="sync-conflict-dialog" aria-labelledby="sync-conflict-title">
    <form class="dialog-body form-section" id="sync-conflict-form">
      <h2 id="sync-conflict-title">处理同步冲突</h2>
      <div class="conflict-list" id="sync-conflict-list"></div>
      <div class="dialog-actions">
        <button class="btn" id="cancel-conflicts" type="button">取消</button>
        <button class="btn btn-primary" type="submit">应用选择</button>
      </div>
    </form>
  </dialog>

  <dialog id="clear-dialog" aria-labelledby="clear-dialog-title">
    <div class="dialog-body">
      <h2 id="clear-dialog-title">确认清空库存</h2>
      <p>全部 282 个色号的库存将归零，并保留一条可追溯的调整记录。</p>
      <div class="dialog-actions">
        <button class="btn" id="cancel-clear" type="button">取消</button>
        <button class="btn btn-danger" id="confirm-clear" type="button">确认清空</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script id="inventory-core">
    (() => {
      'use strict';

      const isPlainObject = (value) => (
        value !== null && typeof value === 'object' && !Array.isArray(value)
      );

      function positiveInteger(value, label = '数量') {
        const normalized = typeof value === 'string' ? value.trim() : value;
        if (normalized === '' || (typeof normalized === 'string' && !/^\d+$/.test(normalized))) {
          throw new Error(`${label}必须是大于 0 的正整数`);
        }
        const number = Number(normalized);
        if (!Number.isInteger(number) || number <= 0) {
          throw new Error(`${label}必须是大于 0 的正整数`);
        }
        if (!Number.isSafeInteger(number)) {
          throw new Error(`${label}必须是安全整数`);
        }
        return number;
      }

      function createEmptyInventory(colors) {
        return Object.fromEntries(colors.map(({ code }) => [code, 0]));
      }

      function normalizeInventory(savedInventory, colors) {
        const source = isPlainObject(savedInventory) ? savedInventory : {};
        return Object.fromEntries(colors.map(({ code }) => {
          const value = source[code];
          return [code, Number.isSafeInteger(value) && value >= 0 ? value : 0];
        }));
      }

      function addStock(inventory, selectedCodes, quantity) {
        if (!Array.isArray(selectedCodes) || selectedCodes.length === 0) {
          throw new Error('请至少选择一个色号');
        }
        const amount = positiveInteger(quantity, '采购数量');
        const uniqueCodes = [...new Set(selectedCodes.map((code) => String(code).trim().toUpperCase()))];
        const next = { ...inventory };
        for (const code of uniqueCodes) {
          if (!Object.prototype.hasOwnProperty.call(inventory, code)) {
            throw new Error(`未知色号：${code}`);
          }
          const updated = next[code] + amount;
          if (!Number.isSafeInteger(updated)) {
            throw new Error(`${code} 入库后的库存超过安全整数范围`);
          }
          next[code] = updated;
        }
        return next;
      }

      function mergeUsageRows(rows) {
        if (!Array.isArray(rows) || rows.length === 0) {
          throw new Error('请至少添加一条消耗记录');
        }
        const usage = {};
        rows.forEach((row, index) => {
          const code = String(row?.code ?? '').trim().toUpperCase();
          if (!code) {
            throw new Error(`第 ${index + 1} 行请选择色号`);
          }
          const amount = positiveInteger(row?.quantity, `第 ${index + 1} 行消耗数量`);
          const merged = (usage[code] || 0) + amount;
          if (!Number.isSafeInteger(merged)) {
            throw new Error(`${code} 的合计消耗超过安全整数范围`);
          }
          usage[code] = merged;
        });
        return usage;
      }

      function consumeStock(inventory, usage) {
        if (!isPlainObject(usage) || Object.keys(usage).length === 0) {
          throw new Error('请至少添加一条消耗记录');
        }
        const normalizedUsage = {};
        for (const [rawCode, rawQuantity] of Object.entries(usage)) {
          const code = String(rawCode).trim().toUpperCase();
          if (!Object.prototype.hasOwnProperty.call(inventory, code)) {
            throw new Error(`未知色号：${code}`);
          }
          normalizedUsage[code] = positiveInteger(rawQuantity, `${code} 消耗数量`);
        }

        const shortages = Object.entries(normalizedUsage)
          .filter(([code, required]) => inventory[code] < required)
          .map(([code, required]) => ({
            code,
            available: inventory[code],
            required,
            missing: required - inventory[code]
          }));

        if (shortages.length > 0) {
          return { ok: false, inventory: { ...inventory }, shortages };
        }

        const next = { ...inventory };
        for (const [code, required] of Object.entries(normalizedUsage)) {
          next[code] -= required;
        }
        return { ok: true, inventory: next, shortages: [] };
      }

      function isLowStock(quantity, threshold) {
        return quantity < threshold;
      }

      function cloneGroups(groups) {
        return Object.fromEntries(
          Object.entries(groups).map(([name, codes]) => [name, [...codes]])
        );
      }

      const MAX_IMAGE_DATA_LENGTH = 400000;

      function normalizeImageData(value, label = '图片') {
        if (value === undefined || value === null || value === '') return '';
        if (typeof value !== 'string' || !/^data:image\/[a-z0-9.+-]+;base64,[a-z0-9+/=]+$/i.test(value)) {
          throw new Error(`${label}格式无效`);
        }
        if (value.length > MAX_IMAGE_DATA_LENGTH) {
          throw new Error(`${label}过大，请选择较小图片`);
        }
        return value;
      }

      function normalizeUsageTemplates(templates, config) {
        if (templates === undefined) return {};
        if (!isPlainObject(templates)) throw new Error('备份中的图纸模板无效');
        const knownCodes = new Set(config.colors.map(({ code }) => code));
        const normalized = {};
        for (const [rawName, template] of Object.entries(templates)) {
          const name = String(rawName).trim().slice(0, 80);
          if (!name || !isPlainObject(template) || !isPlainObject(template.items)) {
            throw new Error('备份中的图纸模板无效');
          }
          const items = {};
          for (const [rawCode, rawQuantity] of Object.entries(template.items)) {
            const code = String(rawCode).trim().toUpperCase();
            if (rawCode !== code || !knownCodes.has(code)) {
              throw new Error(`图纸模板包含未知色号：${rawCode}`);
            }
            const quantity = positiveInteger(rawQuantity, `${name} 的 ${code} 数量`);
            items[code] = quantity;
          }
          if (Object.keys(items).length === 0) throw new Error('图纸模板必须包含至少一个色号');
          normalized[name] = {
            items,
            imageData: normalizeImageData(template.imageData, `${name} 图片`)
          };
        }
        return normalized;
      }

      function createBackup(inventory, config) {
        return {
          schemaVersion: config.schemaVersion,
          exportedAt: new Date().toISOString(),
          settings: {
            lowStockThreshold: config.lowStockThreshold,
            groups: cloneGroups(config.groups),
            usageTemplates: {}
          },
          inventory: normalizeInventory(inventory, config.colors)
        };
      }

      function validateGroups(groups, config) {
        if (!isPlainObject(groups)) {
          throw new Error('备份中的色系配置无效');
        }
        const knownCodes = new Set(config.colors.map(({ code }) => code));
        const seen = new Set();
        const reservedNames = new Set(['__proto__', 'prototype', 'constructor']);
        const normalized = Object.create(null);
        for (const [name, codes] of Object.entries(groups)) {
          if (reservedNames.has(name)) {
            throw new Error(`备份色系不能使用保留名称：${name}`);
          }
          if (!name || !Array.isArray(codes) || codes.length === 0) {
            throw new Error('备份中的色系配置无效');
          }
          normalized[name] = codes.map((rawCode) => {
            const code = String(rawCode).trim().toUpperCase();
            if (!knownCodes.has(code)) {
              throw new Error(`备份色系包含未知色号：${code}`);
            }
            if (seen.has(code)) {
              throw new Error(`备份色系重复包含色号：${code}`);
            }
            seen.add(code);
            return code;
          });
        }
        for (const { code, group } of config.colors) {
          if (seen.has(code)) continue;
          if (!normalized[group]) normalized[group] = [];
          normalized[group].push(code);
          seen.add(code);
        }
        return normalized;
      }

      function parseBackup(text, config) {
        let data;
        try {
          data = JSON.parse(text);
        } catch {
          throw new Error('备份文件不是有效的 JSON');
        }
        if (!isPlainObject(data)) {
          throw new Error('备份文件结构无效');
        }
        if (data.schemaVersion !== config.schemaVersion) {
          throw new Error('备份版本不受支持');
        }
        if (!isPlainObject(data.inventory)) {
          throw new Error('备份中的库存数据无效');
        }
        if (data.settings !== undefined && !isPlainObject(data.settings)) {
          throw new Error('备份中的设置数据无效');
        }

        const knownCodes = new Set(config.colors.map(({ code }) => code));
        for (const [rawCode, quantity] of Object.entries(data.inventory)) {
          const code = String(rawCode).trim().toUpperCase();
          if (rawCode !== code) {
            throw new Error(`备份色号必须使用标准格式：${rawCode}`);
          }
          if (!knownCodes.has(code)) {
            throw new Error(`备份包含未知色号：${code}`);
          }
          if (!Number.isInteger(quantity) || quantity < 0) {
            throw new Error(`${code} 的库存必须是非负整数`);
          }
          if (!Number.isSafeInteger(quantity)) {
            throw new Error(`${code} 的库存必须是安全整数`);
          }
        }

        const threshold = data.settings?.lowStockThreshold ?? config.lowStockThreshold;
        if (!Number.isSafeInteger(threshold) || threshold < 0) {
          throw new Error('备份中的预警阈值必须是非负整数');
        }
        const groups = data.settings?.groups
          ? validateGroups(data.settings.groups, config)
          : cloneGroups(config.groups);
        const usageTemplates = normalizeUsageTemplates(data.settings?.usageTemplates, config);

        return {
          schemaVersion: config.schemaVersion,
          settings: { lowStockThreshold: threshold, groups, usageTemplates },
          inventory: normalizeInventory(data.inventory, config.colors)
        };
      }

      window.InventoryCore = Object.freeze({
        createEmptyInventory,
        normalizeInventory,
        addStock,
        mergeUsageRows,
        consumeStock,
        isLowStock,
        createBackup,
        parseBackup,
        normalizeImageData,
        normalizeUsageTemplates
      });
    })();
  </script>

  <script id="ledger-core">
    (() => {
      'use strict';

      const WAREHOUSE_SCHEMA_VERSION = 2;
      const TRANSACTION_TYPES = new Set(['opening', 'purchase', 'consume', 'adjustment']);
      const UUID_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

      class LedgerValidationError extends Error {
        constructor(message, failure = null) {
          super(message);
          this.name = 'LedgerValidationError';
          this.failure = failure;
        }
      }

      const isPlainObject = (value) => (
        value !== null && typeof value === 'object' && !Array.isArray(value)
      );

      const clone = (value) => JSON.parse(JSON.stringify(value));

      function assertUuid(value, label) {
        if (typeof value !== 'string' || !UUID_PATTERN.test(value)) {
          throw new LedgerValidationError(`${label}不是有效 UUID`);
        }
        return value;
      }

      function assertIso(value, label) {
        if (typeof value !== 'string') {
          throw new LedgerValidationError(`${label}不是有效时间`);
        }
        const parsed = new Date(value);
        if (Number.isNaN(parsed.getTime()) || parsed.toISOString() !== value) {
          throw new LedgerValidationError(`${label}不是标准 ISO 时间`);
        }
        return value;
      }

      function normalizeSettings(settings, config) {
        const parsed = window.InventoryCore.parseBackup(JSON.stringify({
          schemaVersion: config.schemaVersion,
          settings,
          inventory: {}
        }), config);
        return parsed.settings;
      }

      function validateTransaction(transaction, config) {
        if (!isPlainObject(transaction)) {
          throw new LedgerValidationError('流水记录结构无效');
        }
        const id = assertUuid(transaction.id, '流水 ID');
        if (!TRANSACTION_TYPES.has(transaction.type)) {
          throw new LedgerValidationError(`流水类型无效：${transaction.type}`);
        }
        const label = typeof transaction.label === 'string' && transaction.label.trim()
          ? transaction.label.trim().slice(0, 80)
          : transaction.type;
        const imageData = window.InventoryCore.normalizeImageData(transaction.imageData);
        const imageName = typeof transaction.imageName === 'string'
          ? transaction.imageName.trim().slice(0, 120)
          : '';
        if (!isPlainObject(transaction.items) || Object.keys(transaction.items).length === 0) {
          throw new LedgerValidationError('流水必须包含至少一个色号');
        }
        const knownCodes = new Set(config.colors.map(({ code }) => code));
        const items = {};
        for (const [rawCode, quantity] of Object.entries(transaction.items)) {
          const code = String(rawCode).trim().toUpperCase();
          if (rawCode !== code || !knownCodes.has(code)) {
            throw new LedgerValidationError(`流水包含非标准色号：${rawCode}`);
          }
          if (transaction.type === 'adjustment') {
            if (!Number.isSafeInteger(quantity) || quantity === 0) {
              throw new LedgerValidationError(`${code} 调整数必须是非零安全整数`);
            }
          } else if (!Number.isSafeInteger(quantity) || quantity <= 0) {
            throw new LedgerValidationError(`${code} 数量必须是正安全整数`);
          }
          items[code] = quantity;
        }
        const deletedAt = transaction.deletedAt === null
          ? null
          : assertIso(transaction.deletedAt, '删除时间');
        return {
          id,
          type: transaction.type,
          label,
          items,
          ...(imageData ? { imageData } : {}),
          ...(imageName ? { imageName } : {}),
          occurredAt: assertIso(transaction.occurredAt, '发生时间'),
          createdAt: assertIso(transaction.createdAt, '创建时间'),
          updatedAt: assertIso(transaction.updatedAt, '修改时间'),
          deviceId: assertUuid(transaction.deviceId, '设备 ID'),
          deletedAt
        };
      }

      function validateWarehouse(data, config) {
        if (!isPlainObject(data) || data.schemaVersion !== WAREHOUSE_SCHEMA_VERSION) {
          throw new LedgerValidationError('豆仓数据版本不受支持');
        }
        if (!Array.isArray(data.transactions)) {
          throw new LedgerValidationError('流水列表结构无效');
        }
        const seen = new Set();
        const transactions = data.transactions.map((transaction) => {
          const normalized = validateTransaction(transaction, config);
          if (seen.has(normalized.id)) {
            throw new LedgerValidationError(`流水 ID 重复：${normalized.id}`);
          }
          seen.add(normalized.id);
          return normalized;
        });
        return {
          schemaVersion: WAREHOUSE_SCHEMA_VERSION,
          warehouseId: assertUuid(data.warehouseId, '豆仓 ID'),
          settings: normalizeSettings(data.settings, config),
          transactions,
          updatedAt: assertIso(data.updatedAt, '豆仓修改时间')
        };
      }

      function compareTransactions(left, right) {
        return left.occurredAt.localeCompare(right.occurredAt)
          || left.createdAt.localeCompare(right.createdAt)
          || left.id.localeCompare(right.id);
      }

      function replay(data, config) {
        const warehouse = validateWarehouse(data, config);
        const inventory = window.InventoryCore.createEmptyInventory(config.colors);
        const transactions = warehouse.transactions
          .filter(({ deletedAt }) => deletedAt === null)
          .slice()
          .sort(compareTransactions);

        for (const transaction of transactions) {
          const deltas = Object.entries(transaction.items).map(([code, quantity]) => [
            code,
            transaction.type === 'consume'
              ? -quantity
              : transaction.type === 'adjustment' ? quantity : quantity
          ]);
          for (const [code, delta] of deltas) {
            const next = inventory[code] + delta;
            if (!Number.isSafeInteger(next)) {
              return {
                ok: false,
                inventory: null,
                failure: {
                  kind: 'overflow',
                  transactionId: transaction.id,
                  occurredAt: transaction.occurredAt,
                  code,
                  available: inventory[code],
                  delta
                }
              };
            }
            if (next < 0) {
              const required = -delta;
              return {
                ok: false,
                inventory: null,
                failure: {
                  kind: 'shortage',
                  transactionId: transaction.id,
                  occurredAt: transaction.occurredAt,
                  code,
                  available: inventory[code],
                  required,
                  missing: required - inventory[code]
                }
              };
            }
          }
          for (const [code, delta] of deltas) inventory[code] += delta;
        }
        return { ok: true, inventory, failure: null };
      }

      function throwReplayFailure(result) {
        if (result.ok) return;
        const failure = result.failure;
        const message = failure.kind === 'shortage'
          ? `${failure.code} 在 ${failure.occurredAt} 库存不足，还差 ${failure.missing} 颗`
          : `${failure.code} 在 ${failure.occurredAt} 的库存超出安全整数范围`;
        throw new LedgerValidationError(message, failure);
      }

      function createEmptyWarehouse(config, deviceId, now, idFactory) {
        assertUuid(deviceId, '设备 ID');
        assertIso(now, '创建时间');
        const warehouse = {
          schemaVersion: WAREHOUSE_SCHEMA_VERSION,
          warehouseId: assertUuid(idFactory(), '豆仓 ID'),
          settings: {
          lowStockThreshold: config.lowStockThreshold,
            groups: clone(config.groups),
            usageTemplates: {}
          },
          transactions: [],
          updatedAt: now
        };
        return validateWarehouse(warehouse, config);
      }

      function createTransaction({ id, type, label, items, imageData = '', imageName = '', occurredAt, deviceId, now }) {
        return {
          id,
          type,
          label,
          items: clone(items),
          ...(imageData ? { imageData } : {}),
          ...(imageName ? { imageName } : {}),
          occurredAt,
          createdAt: now,
          updatedAt: now,
          deviceId,
          deletedAt: null
        };
      }

      function migrateV1(v1, config, deviceId, now, idFactory) {
        const parsed = window.InventoryCore.parseBackup(JSON.stringify({
          ...clone(v1),
          schemaVersion: config.schemaVersion
        }), config);
        const warehouse = createEmptyWarehouse(config, deviceId, now, idFactory);
        warehouse.settings = parsed.settings;
        const items = Object.fromEntries(
          Object.entries(parsed.inventory).filter(([, quantity]) => quantity > 0)
        );
        if (Object.keys(items).length > 0) {
          warehouse.transactions.push(createTransaction({
            id: idFactory(),
            type: 'opening',
            label: '旧版库存迁移',
            items,
            occurredAt: now,
            deviceId,
            now
          }));
        }
        return validateWarehouse(warehouse, config);
      }

      function appendTransaction(warehouse, transaction, config) {
        const normalized = validateTransaction(transaction, config);
        const candidate = {
          ...clone(warehouse),
          transactions: [...warehouse.transactions.map(clone), normalized],
          updatedAt: normalized.updatedAt
        };
        const validated = validateWarehouse(candidate, config);
        throwReplayFailure(replay(validated, config));
        return validated;
      }

      function replaceTransaction(warehouse, transaction, config) {
        const normalized = validateTransaction(transaction, config);
        let found = false;
        const candidate = {
          ...clone(warehouse),
          transactions: warehouse.transactions.map((existing) => {
            if (existing.id !== normalized.id) return clone(existing);
            found = true;
            return normalized;
          }),
          updatedAt: normalized.updatedAt
        };
        if (!found) throw new LedgerValidationError(`找不到流水：${normalized.id}`);
        const validated = validateWarehouse(candidate, config);
        throwReplayFailure(replay(validated, config));
        return validated;
      }

      function deleteTransaction(warehouse, id, deviceId, now, config) {
        assertUuid(id, '流水 ID');
        assertUuid(deviceId, '设备 ID');
        assertIso(now, '删除时间');
        const existing = warehouse.transactions.find((transaction) => transaction.id === id);
        if (!existing) throw new LedgerValidationError(`找不到流水：${id}`);
        return replaceTransaction(warehouse, {
          ...clone(existing),
          updatedAt: now,
          deviceId,
          deletedAt: now
        }, config);
      }

      function createZeroAdjustment(warehouse, config, { id, deviceId, now }) {
        const result = replay(warehouse, config);
        throwReplayFailure(result);
        const items = Object.fromEntries(
          Object.entries(result.inventory)
            .filter(([, quantity]) => quantity !== 0)
            .map(([code, quantity]) => [code, -quantity])
        );
        if (Object.keys(items).length === 0) return null;
        return createTransaction({
          id,
          type: 'adjustment',
          label: '库存归零调整',
          items,
          occurredAt: now,
          deviceId,
          now
        });
      }

      window.LedgerCore = Object.freeze({
        WAREHOUSE_SCHEMA_VERSION,
        LedgerValidationError,
        createEmptyWarehouse,
        createTransaction,
        migrateV1,
        validateWarehouse,
        replay,
        appendTransaction,
        replaceTransaction,
        deleteTransaction,
        createZeroAdjustment
      });
    })();
  </script>

  <script id="sync-core">
    (() => {
      'use strict';

      class GitHubSyncError extends Error {
        constructor(message, { status = null, category = 'github' } = {}) {
          super(message);
          this.name = 'GitHubSyncError';
          this.status = status;
          this.category = category;
        }
      }

      function encodeUtf8Base64(text) {
        const bytes = new TextEncoder().encode(String(text));
        let binary = '';
        const chunkSize = 0x8000;
        for (let index = 0; index < bytes.length; index += chunkSize) {
          binary += String.fromCharCode(...bytes.subarray(index, index + chunkSize));
        }
        return btoa(binary);
      }

      function decodeUtf8Base64(base64) {
        const binary = atob(String(base64).replace(/\s/g, ''));
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }
        return new TextDecoder().decode(bytes);
      }

      function requiredText(value, label) {
        const normalized = String(value ?? '').trim();
        if (!normalized || normalized === '.' || normalized === '..') {
          throw new GitHubSyncError(`请输入有效的${label}`, { category: 'configuration' });
        }
        return normalized;
      }

      function sanitizeSyncConfig(config) {
        const owner = requiredText(config?.owner, '仓库所有者');
        const repo = requiredText(config?.repo, '仓库名称');
        const token = requiredText(config?.token, '访问令牌');
        const path = requiredText(config?.path, '同步文件路径').replace(/\\/g, '/');
        const segments = path.split('/');
        if (path.startsWith('/') || path.endsWith('/')
          || segments.some((segment) => !segment || segment === '.' || segment === '..')) {
          throw new GitHubSyncError('请输入有效的同步文件路径', { category: 'configuration' });
        }
        return { owner, repo, path, token };
      }

      function errorCategory(status, response) {
        if (status === 401) return 'authentication';
        if (status === 403) {
          return response?.headers?.get?.('x-ratelimit-remaining') === '0'
            ? 'rate-limit'
            : 'permission';
        }
        if (status === 404) return 'not-found';
        if (status === 409 || status === 422) return 'conflict';
        if (status === 429) return 'rate-limit';
        return 'github';
      }

      class GitHubClient {
        constructor(config, { fetchImpl, timeoutMs = 15000 } = {}) {
          this.config = sanitizeSyncConfig(config);
          this.fetchImpl = fetchImpl || window.fetch.bind(window);
          this.timeoutMs = timeoutMs;
          const owner = encodeURIComponent(this.config.owner);
          const repo = encodeURIComponent(this.config.repo);
          this.repoUrl = `https://api.github.com/repos/${owner}/${repo}`;
          const encodedPath = this.config.path.split('/').map(encodeURIComponent).join('/');
          this.fileUrl = `${this.repoUrl}/contents/${encodedPath}`;
        }

        headers() {
          return {
            Authorization: `Bearer ${this.config.token}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28'
          };
        }

        async fetch(url, options) {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), this.timeoutMs);
          try {
            return await this.fetchImpl(url, { ...options, signal: controller.signal });
          } catch (error) {
            if (error?.name === 'AbortError') {
              throw new GitHubSyncError('连接 GitHub 超时', { category: 'timeout' });
            }
            throw new GitHubSyncError('无法连接 GitHub，请检查网络', { category: 'network' });
          } finally {
            clearTimeout(timer);
          }
        }

        async responseError(response) {
          let message = '';
          try {
            const body = await response.json();
            message = typeof body?.message === 'string' ? body.message : '';
          } catch {
            message = '';
          }
          const status = response.status;
          const detail = message ? `：${message}` : '';
          throw new GitHubSyncError(`GitHub 请求失败 (${status})${detail}`, {
            status,
            category: errorCategory(status, response)
          });
        }

        async testConnection() {
          const response = await this.fetch(this.repoUrl, {
            method: 'GET', headers: this.headers()
          });
          if (!response.ok) await this.responseError(response);
          const data = await response.json();
          return { ok: true, private: Boolean(data.private) };
        }

        async getFile() {
          const response = await this.fetch(this.fileUrl, {
            method: 'GET', headers: this.headers()
          });
          if (response.status === 404) return { exists: false, sha: null, data: null };
          if (!response.ok) await this.responseError(response);
          const body = await response.json();
          try {
            return {
              exists: true,
              sha: body.sha,
              data: JSON.parse(decodeUtf8Base64(body.content))
            };
          } catch {
            throw new GitHubSyncError('云端同步文件不是有效的 JSON', {
              status: response.status,
              category: 'invalid-data'
            });
          }
        }

        async putFile(data, sha = null) {
          const body = {
            message: '同步拼豆库存',
            content: encodeUtf8Base64(JSON.stringify(data, null, 2))
          };
          if (sha !== null) body.sha = sha;
          const response = await this.fetch(this.fileUrl, {
            method: 'PUT',
            headers: { ...this.headers(), 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          if (!response.ok) await this.responseError(response);
          const result = await response.json();
          return { sha: result?.content?.sha || result?.commit?.sha || null };
        }
      }

      const cloneValue = (value) => (
        value === undefined ? undefined : JSON.parse(JSON.stringify(value))
      );

      function canonicalize(value) {
        if (Array.isArray(value)) return value.map(canonicalize);
        if (value && typeof value === 'object') {
          return Object.fromEntries(
            Object.keys(value).sort().map((key) => [key, canonicalize(value[key])])
          );
        }
        return value;
      }

      const stableJson = (value) => (
        value === undefined ? '__undefined__' : JSON.stringify(canonicalize(value))
      );

      function resolveThreeWay(kind, id, base, local, remote, conflicts) {
        if (stableJson(local) === stableJson(remote)) return cloneValue(local);
        if (stableJson(local) === stableJson(base)) return cloneValue(remote);
        if (stableJson(remote) === stableJson(base)) return cloneValue(local);
        conflicts.push({
          kind,
          id,
          base: cloneValue(base) ?? null,
          local: cloneValue(local) ?? null,
          remote: cloneValue(remote) ?? null
        });
        return cloneValue(base ?? local ?? remote);
      }

      const MergeCore = Object.freeze({
        threeWayMerge(base, local, remote) {
          const conflicts = [];
          const baseId = base?.warehouseId ?? null;
          if (!local || !remote || local.warehouseId !== remote.warehouseId
            || (baseId && (local.warehouseId !== baseId || remote.warehouseId !== baseId))) {
            conflicts.push({
              kind: 'warehouse', id: 'warehouseId',
              base: baseId, local: local?.warehouseId ?? null, remote: remote?.warehouseId ?? null
            });
            return { merged: null, conflicts };
          }

          const baseTransactions = new Map((base?.transactions || []).map((item) => [item.id, item]));
          const localTransactions = new Map(local.transactions.map((item) => [item.id, item]));
          const remoteTransactions = new Map(remote.transactions.map((item) => [item.id, item]));
          const ids = [...new Set([
            ...baseTransactions.keys(), ...localTransactions.keys(), ...remoteTransactions.keys()
          ])].sort();
          const transactions = [];
          for (const id of ids) {
            const resolved = resolveThreeWay(
              'transaction', id,
              baseTransactions.get(id), localTransactions.get(id), remoteTransactions.get(id),
              conflicts
            );
            if (resolved !== undefined) transactions.push(resolved);
          }

          const settings = resolveThreeWay(
            'settings', 'settings', base?.settings, local.settings, remote.settings, conflicts
          );
          const updateTimes = [base?.updatedAt, local.updatedAt, remote.updatedAt]
            .filter(Boolean).sort();
          const merged = {
            schemaVersion: 2,
            warehouseId: local.warehouseId,
            settings,
            transactions,
            updatedAt: updateTimes[updateTimes.length - 1]
          };
          return { merged, conflicts };
        },
        stableJson
      });

      class SyncManager {
        constructor({
          store,
          clientFactory = (config) => new GitHubClient(config),
          isOnline = () => typeof navigator === 'undefined' || navigator.onLine,
          validateWarehouse = (warehouse) => window.LedgerCore.validateWarehouse(warehouse, window.APP_CONFIG),
          replay = (warehouse) => window.LedgerCore.replay(warehouse, window.APP_CONFIG),
          onStatus = () => {},
          onFirstSync = null,
          onConflicts = null
        }) {
          this.store = store;
          this.clientFactory = clientFactory;
          this.isOnline = isOnline;
          this.validateWarehouse = validateWarehouse;
          this.replay = replay;
          this.onStatus = onStatus;
          this.onFirstSync = onFirstSync;
          this.onConflicts = onConflicts;
          this.syncConfig = store.loadSyncConfig?.() || null;
          this.running = null;
          this.dirty = false;
        }

        configure(config) {
          const normalized = sanitizeSyncConfig(config);
          const previous = this.syncConfig;
          const sameTarget = previous
            && previous.owner === normalized.owner
            && previous.repo === normalized.repo
            && previous.path === normalized.path;
          this.syncConfig = {
            ...normalized,
            pending: true,
            lastRemoteSha: sameTarget ? previous.lastRemoteSha ?? null : null,
            lastSyncedData: sameTarget ? previous.lastSyncedData ?? null : null
          };
          this.store.saveSyncConfig(this.syncConfig);
          this.onStatus({ state: 'pending', message: '等待同步' });
          return cloneValue(this.syncConfig);
        }

        disconnect() {
          this.syncConfig = null;
          this.store.saveSyncConfig(null);
          this.onStatus({ state: 'unconfigured', message: '未配置同步' });
        }

        async testConnection(config = this.syncConfig) {
          if (!config) throw new GitHubSyncError('尚未配置 GitHub 同步', { category: 'configuration' });
          return this.clientFactory(config).testConnection();
        }

        markPending() {
          if (!this.syncConfig) return false;
          this.syncConfig = { ...this.syncConfig, pending: true };
          this.store.saveSyncConfig(this.syncConfig);
          this.onStatus({ state: 'pending', message: '等待同步' });
          return true;
        }

        validated(data) {
          let warehouse;
          try {
            warehouse = this.validateWarehouse(data);
          } catch (error) {
            throw new GitHubSyncError(`同步数据无效：${error.message}`, { category: 'invalid-data' });
          }
          const replayed = this.replay(warehouse);
          if (!replayed?.ok) {
            const failure = replayed?.failure;
            const message = failure?.kind === 'shortage'
              ? `${failure.code} 库存不足，还差 ${failure.missing} 颗`
              : '同步数据无法重算库存';
            const error = new GitHubSyncError(message, { category: 'invalid-data' });
            error.failure = cloneValue(failure);
            throw error;
          }
          return warehouse;
        }

        resolveMerged(merged, conflicts, choices) {
          if (conflicts.length === 0) return merged;
          if (!choices) {
            throw new GitHubSyncError('同步数据存在冲突', { category: 'merge-conflict' });
          }
          const result = cloneValue(merged);
          const transactions = new Map((result.transactions || []).map((item) => [item.id, item]));
          conflicts.forEach((conflict, index) => {
            const key = `${conflict.kind}:${conflict.id}`;
            const choice = Array.isArray(choices) ? choices[index] : choices[key];
            if (choice !== 'local' && choice !== 'remote') {
              throw new GitHubSyncError('请处理每一项同步冲突', { category: 'merge-conflict' });
            }
            const selected = cloneValue(conflict[choice]);
            if (conflict.kind === 'transaction') {
              if (selected) transactions.set(conflict.id, selected);
              else transactions.delete(conflict.id);
            } else if (conflict.kind === 'settings') {
              result.settings = selected;
            } else {
              throw new GitHubSyncError('两个豆仓无法自动合并', { category: 'warehouse-conflict' });
            }
          });
          result.transactions = [...transactions.values()].sort((left, right) => left.id.localeCompare(right.id));
          return result;
        }

        async chooseFirstSync(local, remote) {
          if (!this.onFirstSync) {
            throw new GitHubSyncError('首次同步需要选择保留方式', { category: 'first-sync' });
          }
          const choice = await this.onFirstSync({
            local: cloneValue(local), remote: cloneValue(remote)
          });
          if (!['cloud', 'local', 'merge'].includes(choice)) {
            throw new GitHubSyncError('已取消首次同步', { category: 'cancelled' });
          }
          return choice;
        }

        async resolveConflicts(merged, conflicts) {
          if (conflicts.length === 0) return merged;
          if (!this.onConflicts) {
            throw new GitHubSyncError('同步数据存在冲突', { category: 'merge-conflict' });
          }
          const choices = await this.onConflicts({
            conflicts: cloneValue(conflicts), merged: cloneValue(merged)
          });
          return this.resolveMerged(merged, conflicts, choices);
        }

        async finish(warehouse, sha) {
          const validated = this.validated(warehouse);
          this.store.saveWarehouse(validated);
          this.syncConfig = {
            ...this.syncConfig,
            pending: false,
            lastRemoteSha: sha,
            lastSyncedData: cloneValue(validated)
          };
          this.store.saveSyncConfig(this.syncConfig);
          this.onStatus({ state: 'synced', message: '已同步' });
          return { status: 'synced', warehouse: cloneValue(validated), sha };
        }

        async syncOnce(client) {
          const local = this.validated(this.store.getWarehouse());
          const remoteFile = await client.getFile();
          if (!remoteFile.exists) {
            const uploaded = await client.putFile(local, null);
            return this.finish(local, uploaded.sha);
          }

          const remote = this.validated(remoteFile.data);
          const base = this.syncConfig.lastSyncedData;
          let selected;
          if (!base) {
            if (local.transactions.length === 0) {
              return this.finish(remote, remoteFile.sha);
            }
            if (remote.transactions.length === 0) {
              selected = local;
            } else {
              const choice = await this.chooseFirstSync(local, remote);
              if (choice === 'cloud') return this.finish(remote, remoteFile.sha);
              if (choice === 'local') {
                selected = local;
              } else {
                const remoteForMerge = { ...remote, warehouseId: local.warehouseId };
                const emptyBase = {
                  ...cloneValue(local), transactions: [], updatedAt: local.updatedAt
                };
                const result = MergeCore.threeWayMerge(emptyBase, local, remoteForMerge);
                selected = await this.resolveConflicts(result.merged, result.conflicts);
              }
            }
          } else {
            const normalizedBase = this.validated(base);
            const result = MergeCore.threeWayMerge(normalizedBase, local, remote);
            selected = await this.resolveConflicts(result.merged, result.conflicts);
          }

          selected = this.validated(selected);
          if (stableJson(selected) === stableJson(remote)) {
            return this.finish(selected, remoteFile.sha);
          }
          const uploaded = await client.putFile(selected, remoteFile.sha);
          return this.finish(selected, uploaded.sha);
        }

        async runSync() {
          if (!this.syncConfig) {
            return { status: 'unconfigured' };
          }
          if (!this.isOnline()) {
            this.markPending();
            this.onStatus({ state: 'offline', message: '离线，等待同步' });
            return { status: 'offline' };
          }
          this.onStatus({ state: 'syncing', message: '正在同步' });
          const client = this.clientFactory(this.syncConfig);
          let lastError;
          for (let attempt = 0; attempt < 3; attempt += 1) {
            try {
              return await this.syncOnce(client);
            } catch (error) {
              lastError = error;
              if (error?.category !== 'conflict' || attempt === 2) break;
            }
          }
          this.markPending();
          this.onStatus({
            state: lastError?.category === 'merge-conflict' ? 'conflict' : 'failed',
            message: lastError?.message || '同步失败'
          });
          throw lastError;
        }

        syncNow() {
          if (this.running) {
            this.dirty = true;
            return this.running;
          }
          this.running = (async () => {
            let result;
            do {
              this.dirty = false;
              result = await this.runSync();
            } while (this.dirty);
            return result;
          })().finally(() => {
            this.running = null;
          });
          return this.running;
        }
      }

      window.SyncCore = Object.freeze({
        GitHubSyncError,
        GitHubClient,
        encodeUtf8Base64,
        decodeUtf8Base64,
        sanitizeSyncConfig,
        MergeCore,
        SyncManager
      });
    })();
  </script>
