      const defaultSettings = () => ({
        lowStockThreshold: APP_CONFIG.lowStockThreshold,
        groups: Object.fromEntries(
          Object.entries(APP_CONFIG.groups).map(([name, codes]) => [name, [...codes]])
        ),
        usageTemplates: {}
      });

      const UUID_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
      const randomUuid = () => crypto.randomUUID();
      const nowIso = () => new Date().toISOString();

      const WarehouseStore = {
        loadDeviceId() {
          const stored = localStorage.getItem(APP_CONFIG.deviceStorageKey);
          if (stored && UUID_PATTERN.test(stored)) return stored;
          const deviceId = randomUuid();
          localStorage.setItem(APP_CONFIG.deviceStorageKey, deviceId);
          return deviceId;
        },

        load() {
          let deviceId;
          try {
            deviceId = this.loadDeviceId();
            const v2Raw = localStorage.getItem(APP_CONFIG.storageKey);
            let warehouse;
            if (v2Raw) {
              warehouse = LedgerCore.validateWarehouse(JSON.parse(v2Raw), APP_CONFIG);
            } else {
              const legacyRaw = localStorage.getItem(APP_CONFIG.legacyStorageKey);
              const now = nowIso();
              if (legacyRaw) {
                warehouse = LedgerCore.migrateV1(
                  JSON.parse(legacyRaw), APP_CONFIG, deviceId, now, randomUuid
                );
              } else {
                warehouse = LedgerCore.createEmptyWarehouse(
                  APP_CONFIG, deviceId, now, randomUuid
                );
              }
              this.save(warehouse);
            }
            const replayed = LedgerCore.replay(warehouse, APP_CONFIG);
            if (!replayed.ok) {
              throw new LedgerCore.LedgerValidationError('本地流水无法重放', replayed.failure);
            }
            return {
              warehouse,
              inventory: replayed.inventory,
              settings: warehouse.settings,
              deviceId,
              error: ''
            };
          } catch (error) {
            const fallbackDeviceId = deviceId && UUID_PATTERN.test(deviceId) ? deviceId : randomUuid();
            const warehouse = LedgerCore.createEmptyWarehouse(
              APP_CONFIG, fallbackDeviceId, nowIso(), randomUuid
            );
            return {
              warehouse,
              inventory: InventoryCore.createEmptyInventory(APP_CONFIG.colors),
              settings: defaultSettings(),
              deviceId: fallbackDeviceId,
              error: `本地数据无法读取：${error.message}。当前显示临时的零库存，原数据未被覆盖。请先导入备份或清空库存。`
            };
          }
        },

        save(warehouse) {
          localStorage.setItem(APP_CONFIG.storageKey, JSON.stringify(warehouse));
        },

        saveSyncConfig(config) {
          if (config === null) {
            localStorage.removeItem(APP_CONFIG.syncStorageKey);
          } else {
            localStorage.setItem(APP_CONFIG.syncStorageKey, JSON.stringify(config));
          }
        },

        loadSyncConfig() {
          const raw = localStorage.getItem(APP_CONFIG.syncStorageKey);
          return raw ? JSON.parse(raw) : null;
        }
      };

      const loaded = WarehouseStore.load();
      const state = {
        warehouse: loaded.warehouse,
        inventory: loaded.inventory,
        settings: loaded.settings,
        deviceId: loaded.deviceId,
        search: '',
        activeGroup: 'ALL',
        selectedCodes: new Set(),
        historyFilters: { type: 'ALL', code: 'ALL', startDate: '', endDate: '', limit: 50 },
        editingTransactionId: null,
        storageLocked: Boolean(loaded.error),
        usageImageData: '',
        usageImageName: '',
        usageImagePromise: Promise.resolve(),
        toastTimer: null
      };
      let syncManager = null;
      let syncTimer = null;
      let firstSyncResolver = null;
      let firstSyncPayload = null;
      let conflictResolver = null;

      if (loaded.error) {
        elements.storageNotice.textContent = loaded.error;
        elements.storageNotice.hidden = false;
      }

      function showToast(message) {
        clearTimeout(state.toastTimer);
        elements.toast.textContent = message;
        elements.toast.classList.add('is-visible');
        state.toastTimer = setTimeout(() => {
          elements.toast.classList.remove('is-visible');
        }, 2200);
      }

      function scheduleSync(delay = 700) {
        if (!syncManager || !syncManager.markPending()) return;
        clearTimeout(syncTimer);
        syncTimer = setTimeout(() => {
          syncManager.syncNow().catch(() => {});
        }, delay);
      }

      function setMessage(element, message = '', { error = true, html = false } = {}) {
        element.className = 'form-message';
        if (error) element.classList.add('is-error');
        if (html) {
          element.replaceChildren(message);
        } else {
          element.textContent = message;
        }
        if (message && error) {
          element.focus({ preventScroll: true });
        }
      }

      function setMutationLock(locked) {
        state.storageLocked = locked;
        document.querySelectorAll('#usage-form button, #usage-form input, #usage-form select, #purchase-form button, #purchase-form input').forEach((control) => {
          control.disabled = locked;
        });
        if (!locked) refreshUsageRemoveButtons();
      }

      function commitWarehouse(candidate, successMessage, errorElement = elements.storageNotice) {
        try {
          const warehouse = LedgerCore.validateWarehouse(candidate, APP_CONFIG);
          const replayed = LedgerCore.replay(warehouse, APP_CONFIG);
          if (!replayed.ok) {
            const { code, occurredAt, missing } = replayed.failure;
            throw new Error(`${code} 在 ${occurredAt} 库存不足，还差 ${missing} 颗`);
          }
          WarehouseStore.save(warehouse);
          state.warehouse = warehouse;
          state.inventory = replayed.inventory;
          state.settings = warehouse.settings;
          elements.lowStockThreshold.value = String(state.settings.lowStockThreshold);
          setMutationLock(false);
          elements.storageNotice.hidden = true;
          elements.storageNotice.textContent = '';
        } catch (error) {
          const message = `保存失败：${error.message}。库存未更改。`;
          elements.storageNotice.textContent = message;
          elements.storageNotice.hidden = false;
          if (errorElement !== elements.storageNotice) setMessage(errorElement, message);
          return false;
        }
        renderDashboard();
        renderInventory();
        renderHistory();
        showToast(successMessage);
        scheduleSync();
        return true;
      }

        const quantities = Object.values(state.inventory);
        const total = quantities.reduce((sum, quantity) => sum + BigInt(quantity), 0n);
        const lowCount = quantities.filter((quantity) => (
          InventoryCore.isLowStock(quantity, state.settings.lowStockThreshold)
        )).length;
        elements.totalStock.textContent = numberFormat.format(total);
        elements.lowStockCount.textContent = numberFormat.format(lowCount);
        elements.colorCount.textContent = numberFormat.format(APP_CONFIG.colors.length);
      }

        elements.lowStockThreshold.value = String(state.settings.lowStockThreshold);

        return state.activeGroup === 'ALL' || state.settings.groups[state.activeGroup]?.includes(code);
      }

      function renderHistory() {
        const activeTransactions = state.warehouse.transactions
          .filter(({ deletedAt }) => deletedAt === null)
          .slice()
          .sort((left, right) => (
            right.occurredAt.localeCompare(left.occurredAt)
            || right.createdAt.localeCompare(left.createdAt)
            || right.id.localeCompare(left.id)
          ));
        const transactions = activeTransactions.filter((transaction) => {
          const day = transaction.occurredAt.slice(0, 10);
          return (state.historyFilters.type === 'ALL' || transaction.type === state.historyFilters.type)
            && (state.historyFilters.code === 'ALL'
              || Object.prototype.hasOwnProperty.call(transaction.items, state.historyFilters.code))
            && (!state.historyFilters.startDate || day >= state.historyFilters.startDate)
            && (!state.historyFilters.endDate || day <= state.historyFilters.endDate);
        });
        const fragment = document.createDocumentFragment();
        for (const transaction of transactions.slice(0, state.historyFilters.limit)) {
          const row = document.createElement('article');
          row.className = 'history-row';
          row.dataset.transactionId = transaction.id;

          const title = document.createElement('span');
          title.className = 'history-title';
          title.textContent = transaction.label;
          if (transaction.imageData) {
            const image = document.createElement('img');
            image.className = 'history-image';
            image.src = transaction.imageData;
            image.alt = transaction.imageName || `${transaction.label} 图片`;
            title.append(image);
          }

          const items = document.createElement('span');
          items.className = 'history-items';
          items.textContent = Object.entries(transaction.items)
            .map(([code, quantity]) => {
              const signed = transaction.type === 'consume' ? -quantity : quantity;
              return `${code} ${signed > 0 ? '+' : ''}${signed}`;
            })
            .join('，');

          const time = document.createElement('time');
          time.className = 'history-time';
          time.dateTime = transaction.occurredAt;
          time.textContent = new Intl.DateTimeFormat('zh-CN', {
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit'
          }).format(new Date(transaction.occurredAt));

          const actions = document.createElement('span');
          actions.className = 'history-actions';
          const edit = makeButton('编辑', 'historyAction', 'edit', 'btn');
          edit.dataset.transactionId = transaction.id;
          edit.disabled = state.storageLocked;
          const remove = makeButton('删除', 'historyAction', 'delete', 'btn btn-danger');
          remove.dataset.transactionId = transaction.id;
          remove.disabled = state.storageLocked;
          actions.append(edit, remove);
          row.append(title, items, time, actions);
          fragment.append(row);
        }
        elements.historyList.replaceChildren(fragment);
        elements.historyCount.textContent = transactions.length === activeTransactions.length
          ? `${transactions.length} 条记录`
          : `${transactions.length} / ${activeTransactions.length} 条`;
        elements.historyEmpty.hidden = transactions.length !== 0;
        elements.historyLoadMore.hidden = transactions.length <= state.historyFilters.limit;
      }

      function readUsageImage(file) {
        return new Promise((resolve, reject) => {
          if (!file) return resolve({ data: '', name: '' });
          if (!file.type.startsWith('image/')) return reject(new Error('请选择图片文件'));
          const reader = new FileReader();
          reader.onerror = () => reject(new Error('图片读取失败'));
          reader.onload = () => {
            const image = new Image();
            image.onerror = () => reject(new Error('图片解析失败'));
            image.onload = () => {
              const scale = Math.min(1, 320 / Math.max(image.width, image.height));
              const canvas = document.createElement('canvas');
              canvas.width = Math.max(1, Math.round(image.width * scale));
              canvas.height = Math.max(1, Math.round(image.height * scale));
              canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
              resolve({ data: canvas.toDataURL('image/jpeg', 0.72), name: file.name });
            };
            image.src = reader.result;
          };
          reader.readAsDataURL(file);
        });
      }

        if (failure?.kind === 'overflow') {

      function readHistoryItems(type) {
        const items = {};
        const seen = new Set();
        const rows = [...elements.historyEditItems.querySelectorAll('.history-edit-row')];
        if (rows.length === 0) throw new Error('请至少保留一个色号');
        rows.forEach((row, index) => {
          const code = row.querySelector('select').value;
          const quantity = Number(row.querySelector('input[type="number"]').value);
          if (!code) throw new Error(`第 ${index + 1} 行请选择色号`);
          if (seen.has(code)) throw new Error(`色号 ${code} 重复，请合并为一行`);
          const valid = type === 'adjustment'
            ? Number.isSafeInteger(quantity) && quantity !== 0
            : Number.isSafeInteger(quantity) && quantity > 0;
          if (!valid) {
            throw new Error(type === 'adjustment'
              ? `第 ${index + 1} 行调整数必须是非零整数`
              : `第 ${index + 1} 行颗数必须是正整数`);
          }
          seen.add(code);
          items[code] = quantity;
        });
        return items;
      }

      function syncErrorMessage(error) {
        const messages = {
          authentication: 'GitHub 令牌无效，请重新填写',
          permission: '令牌没有该仓库的读写权限',
          'not-found': '找不到 GitHub 仓库',
          'rate-limit': 'GitHub 请求次数受限，请稍后重试',
          timeout: '连接 GitHub 超时，请稍后重试',
          network: '网络连接失败，本地数据已保留',
          'invalid-data': '云端数据无效，未覆盖本地数据',
          'merge-conflict': '同步存在冲突，请处理后重试',
          'first-sync': '请选择首次同步方式'
        };
        return messages[error?.category] || error?.message || '同步失败';
      }

      function setSyncStatus({ state: syncState, message }) {
        elements.syncStatus.textContent = message;
        elements.syncStatus.dataset.state = syncState;
        elements.syncMessage.className = 'form-message';
        if (['failed', 'conflict'].includes(syncState)) elements.syncMessage.classList.add('is-error');
        elements.syncMessage.textContent = message;
      }

      function savedSyncConfig() {
        try {
          return WarehouseStore.loadSyncConfig();
        } catch {
          return null;
        }
      }

      function syncFormConfig() {
        const saved = savedSyncConfig();
        return {
          owner: elements.syncOwner.value,
          repo: elements.syncRepo.value,
          path: elements.syncPath.value,
          token: elements.syncToken.value || saved?.token || ''
        };
      }

      function renderSyncConfig() {
        const config = savedSyncConfig();
        elements.syncOwner.value = config?.owner || '';
        elements.syncRepo.value = config?.repo || '';
        elements.syncPath.value = config?.path || 'perler-bead-data.json';
        elements.syncToken.value = '';
        elements.syncToken.placeholder = config?.token
          ? `已保存 ${config.token.slice(0, 6)}...${config.token.slice(-4)}`
          : '粘贴 Token';
        elements.syncNow.disabled = !config;
        elements.disconnectSync.disabled = !config;
      }

      function applySyncedWarehouse(warehouse) {
        const validated = LedgerCore.validateWarehouse(warehouse, APP_CONFIG);
        const replayed = LedgerCore.replay(validated, APP_CONFIG);
        if (!replayed.ok) throw new Error('同步后的库存无法重算');
        WarehouseStore.save(validated);
        state.warehouse = validated;
        state.inventory = replayed.inventory;
        state.settings = validated.settings;
        setMutationLock(false);
        renderGroupFilter();
        renderPurchaseGroups();
        renderColorChecks();
        renderDashboard();
        renderInventory();
        renderHistory();
      }

      function requestFirstSync({ local, remote }) {
        firstSyncPayload = { local, remote };
        elements.firstSyncSummary.textContent = `本地 ${local.transactions.length} 条，云端 ${remote.transactions.length} 条`;
        elements.firstSyncDialog.showModal();
        return new Promise((resolve) => { firstSyncResolver = resolve; });
      }

      function conflictDescription(conflict) {
        if (conflict.kind === 'settings') return '库存设置在两台设备上都已修改';
        if (conflict.kind === 'warehouse') return '检测到两个不同的豆仓';
        const local = conflict.local?.label || '已删除';
        const remote = conflict.remote?.label || '已删除';
        return `${local} / ${remote}`;
      }

      function requestConflictChoices({ conflicts }) {
        const fragment = document.createDocumentFragment();
        conflicts.forEach((conflict, index) => {
          const row = document.createElement('div');
          row.className = 'conflict-row';
          row.dataset.conflictKey = `${conflict.kind}:${conflict.id}`;
          const title = document.createElement('strong');
          title.textContent = conflict.kind === 'transaction'
            ? `记录 ${conflict.id.slice(0, 8)}`
            : conflict.kind === 'settings' ? '库存设置' : '豆仓';
          const copy = document.createElement('p');
          copy.className = 'conflict-copy';
          copy.textContent = conflictDescription(conflict);
          const select = document.createElement('select');
          select.className = 'field';
          select.name = `conflict-${index}`;
          select.setAttribute('aria-label', `${title.textContent}的保留版本`);
          select.append(new Option('保留本地版本', 'local'), new Option('保留云端版本', 'remote'));
          row.append(title, copy, select);
          fragment.append(row);
        });
        elements.syncConflictList.replaceChildren(fragment);
        elements.syncConflictDialog.showModal();
        return new Promise((resolve) => { conflictResolver = resolve; });
      }

      const SyncStore = {
        getWarehouse: () => state.warehouse,
        saveWarehouse: applySyncedWarehouse,
        loadSyncConfig: () => savedSyncConfig(),
        saveSyncConfig: (config) => WarehouseStore.saveSyncConfig(config)
      };

      function initializeSync() {
        syncManager = new SyncManager({
          store: SyncStore,
          clientFactory: (config) => new GitHubClient(config),
          validateWarehouse: (warehouse) => LedgerCore.validateWarehouse(warehouse, APP_CONFIG),
          replay: (warehouse) => LedgerCore.replay(warehouse, APP_CONFIG),
          onStatus: setSyncStatus,
          onFirstSync: requestFirstSync,
          onConflicts: requestConflictChoices
        });
        renderSyncConfig();
        const config = savedSyncConfig();
        if (config) {
          setSyncStatus({
            state: config.pending ? 'pending' : 'synced',
            message: config.pending ? '等待同步' : '已同步'
          });
          syncTimer = setTimeout(() => syncManager.syncNow().catch(() => {}), 700);
        } else {
          setSyncStatus({ state: 'unconfigured', message: '未配置同步' });
        }
      }

      function clearInventoryWithHistory() {
        let candidate;
        if (state.storageLocked) {
          candidate = LedgerCore.createEmptyWarehouse(
            APP_CONFIG, state.deviceId, nowIso(), randomUuid
          );
        } else {
          const now = nowIso();
          const adjustment = LedgerCore.createZeroAdjustment(state.warehouse, APP_CONFIG, {
            id: randomUuid(), deviceId: state.deviceId, now
          });
          if (!adjustment) {
            showToast('库存已经是零');
            return true;
          }
          candidate = LedgerCore.appendTransaction(state.warehouse, adjustment, APP_CONFIG);
        }
        return commitWarehouse(candidate, '全部库存已清空', elements.dataMessage);
      }

      elements.search.addEventListener('input', () => {
        state.search = elements.search.value;
        renderInventory();
      });

      elements.groupFilter.addEventListener('click', (event) => {
        const button = event.target.closest('[data-filter-group]');
        if (!button) return;
        state.activeGroup = button.dataset.filterGroup;
        renderGroupFilter();
        renderInventory();
      });

      [elements.historyTypeFilter, elements.historyCodeFilter,
        elements.historyStartDate, elements.historyEndDate].forEach((control) => {
        control.addEventListener('change', () => {
          state.historyFilters = {
            type: elements.historyTypeFilter.value,
            code: elements.historyCodeFilter.value,
            startDate: elements.historyStartDate.value,
            endDate: elements.historyEndDate.value,
            limit: 50
          };
          renderHistory();
        });
      });

      elements.historyLoadMore.addEventListener('click', () => {
        state.historyFilters.limit += 50;
        renderHistory();
      });

      elements.historyList.addEventListener('click', (event) => {
        const button = event.target.closest('[data-history-action]');
        if (!button || button.disabled) return;
        const id = button.dataset.transactionId;
        if (button.dataset.historyAction === 'edit') {
          openHistoryDialog(id);
          return;
        }
        if (!window.confirm('确认删除这条历史记录？删除后将重新计算全部库存。')) return;
        try {
          const candidate = LedgerCore.deleteTransaction(
            state.warehouse, id, state.deviceId, nowIso(), APP_CONFIG
          );
          if (commitWarehouse(candidate, '历史记录已删除', elements.historyMessage)) {
            setMessage(elements.historyMessage);
          }
        } catch (error) {
          setMessage(elements.historyMessage, historyFailureMessage(error));
        }
      });

      elements.addHistoryItem.addEventListener('click', () => addHistoryEditRow());

      elements.historyEditItems.addEventListener('click', (event) => {
        const button = event.target.closest('.remove-history-item');
        if (!button || button.disabled) return;
        button.closest('.history-edit-row').remove();
        refreshHistoryEditRows();
      });

      elements.historyType.addEventListener('change', refreshHistoryEditRows);
      elements.cancelHistory.addEventListener('click', closeHistoryDialog);
      elements.historyDialog.addEventListener('click', (event) => {
        if (event.target === elements.historyDialog) closeHistoryDialog();
      });

      elements.historyForm.addEventListener('submit', (event) => {
        event.preventDefault();
        try {
          const existing = state.warehouse.transactions.find(({ id }) => id === state.editingTransactionId);
          if (!existing || existing.deletedAt !== null) throw new Error('这条历史记录已不存在');
          const label = elements.historyLabel.value.trim();
          if (!label) throw new Error('请输入记录名称');
          const occurred = new Date(elements.historyOccurredAt.value);
          if (Number.isNaN(occurred.getTime())) throw new Error('请选择有效的发生时间');
          const now = nowIso();
          const replacement = {
            ...existing,
            type: elements.historyType.value,
            label,
            items: readHistoryItems(elements.historyType.value),
            occurredAt: occurred.toISOString(),
            updatedAt: now,
            deviceId: state.deviceId
          };
          const candidate = LedgerCore.replaceTransaction(state.warehouse, replacement, APP_CONFIG);
          if (commitWarehouse(candidate, '历史记录已修改', elements.historyDialogMessage)) {
            closeHistoryDialog();
          }
        } catch (error) {
          setMessage(elements.historyDialogMessage, historyFailureMessage(error));
        }
      });

      elements.addUsageRow.addEventListener('click', () => addUsageRow());

      elements.usageLabel.addEventListener('input', () => {
        const name = elements.usageLabel.value.trim();
        if (name && state.settings.usageTemplates?.[name]) applyUsageTemplate(name);
      });

      elements.usageImage.addEventListener('change', async () => {
        state.usageImagePromise = readUsageImage(elements.usageImage.files[0])
          .then((result) => {
            state.usageImageData = result.data;
            state.usageImageName = result.name;
            elements.usageImageStatus.textContent = result.data ? `已载入图片：${result.name}` : '';
          })
          .catch((error) => {
            state.usageImageData = '';
            state.usageImageName = '';
            elements.usageImageStatus.textContent = error.message;
            elements.usageImage.value = '';
          });
      });

      elements.usageList.addEventListener('input', (event) => {
        const input = event.target.closest('[data-usage-code-input]');
        if (!input) return;
        setUsageCode(input.closest('.usage-row'), input.value);
      });

      elements.usageList.addEventListener('change', (event) => {
        const row = event.target.closest('.usage-row');
        if (!row) return;
        if (event.target.matches('.legacy-code-select')) setUsageCode(row, event.target.value);
        if (event.target.matches('[data-usage-group]')) {
          const group = event.target.value.trim().toUpperCase();
          event.target.value = group;
          row.querySelector('[data-usage-number]').value = '';
          row.querySelector('.legacy-code-select').value = '';
          row.querySelector('[data-usage-code-input]').value = '';
          const swatch = row.querySelector('.usage-swatch');
          swatch.style.backgroundColor = '';
          swatch.removeAttribute('title');
          swatch.removeAttribute('aria-label');
        }
        if (event.target.matches('[data-usage-number]')) {
          const group = row.querySelector('[data-usage-group]').value;
          setUsageCode(row, group && event.target.value ? `${group}${event.target.value}` : '');
        }
      });

      elements.usageList.addEventListener('keydown', (event) => {
        const row = event.target.closest('.usage-row');
        if (!row) return;
        const rows = [...elements.usageList.querySelectorAll('.usage-row')];
        const rowIndex = rows.indexOf(row);
        if (event.key === 'Enter' && event.target.matches('input[type="number"]')) {
          event.preventDefault();
          addUsageRow();
          elements.usageList.lastElementChild.querySelector('[data-usage-code-input]').focus();
        } else if ((event.key === 'ArrowUp' || event.key === 'ArrowDown') && event.target.matches('input, select')) {
          const targetRow = rows[rowIndex + (event.key === 'ArrowUp' ? -1 : 1)];
          if (targetRow) {
            event.preventDefault();
            const target = targetRow.querySelector(`[name="${event.target.name}"]`) || targetRow.querySelector('[data-usage-code-input]');
            target?.focus();
          }
        } else if ((event.key === 'ArrowLeft' || event.key === 'ArrowRight') && event.target.matches('input, select')) {
          const fields = [...row.querySelectorAll('[data-usage-group], [data-usage-number], [data-usage-code-input], input[type="number"]')];
          const fieldIndex = fields.indexOf(event.target);
          const target = fields[fieldIndex + (event.key === 'ArrowLeft' ? -1 : 1)];
          if (target) {
            const atBoundary = event.target.tagName === 'INPUT' && typeof event.target.selectionStart === 'number'
              ? (event.key === 'ArrowLeft' ? event.target.selectionStart === 0 : event.target.selectionStart === event.target.value.length)
              : true;
            if (atBoundary) {
              event.preventDefault();
              target.focus();
            }
          }
        }
      });

      elements.usageList.addEventListener('click', (event) => {
        const button = event.target.closest('.remove-usage-row');
        if (!button || button.disabled) return;
        button.closest('.usage-row').remove();
        refreshUsageRemoveButtons();
      });

      elements.usageForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (state.storageLocked) {
          setMessage(elements.usageMessage, '请先导入备份或清空无法读取的本地数据');
          return;
        }
        try {
          await state.usageImagePromise;
          const rows = [...elements.usageList.querySelectorAll('.usage-row')].map((row) => ({
            code: row.querySelector('select').value,
            quantity: row.querySelector('input[type="number"]').value
          }));
          const usage = InventoryCore.mergeUsageRows(rows);
          for (const code of Object.keys(usage)) {
            if (!colorByCode.has(code)) throw new Error(`未知色号：${code}`);
          }
          const result = InventoryCore.consumeStock(state.inventory, usage);
          if (!result.ok) {
            showShortages(result.shortages);
            return;
          }
          const label = elements.usageLabel.value.trim() || '图纸消耗';
          const transaction = createAppTransaction('consume', label, usage, {
            imageData: state.usageImageData,
            imageName: state.usageImageName
          });
          const usageTemplates = {
            ...(state.settings.usageTemplates || {}),
            [label]: { items: usage, imageData: state.usageImageData || '' }
          };
          const candidate = LedgerCore.appendTransaction({
            ...state.warehouse,
            settings: { ...state.warehouse.settings, usageTemplates }
          }, transaction, APP_CONFIG);
          if (commitWarehouse(candidate, `已扣减 ${Object.keys(usage).length} 个色号`, elements.usageMessage)) {
            setMessage(elements.usageMessage);
            resetUsageRows();
            elements.usageLabel.value = '';
            elements.usageImage.value = '';
            elements.usageImageStatus.textContent = '';
            state.usageImageData = '';
            state.usageImageName = '';
            state.usageImagePromise = Promise.resolve();
          }
        } catch (error) {
          setMessage(elements.usageMessage, error.message);
        }
      });

      elements.purchaseGroupActions.addEventListener('click', (event) => {
        const button = event.target.closest('[data-select-group]');
        if (!button) return;
        state.settings.groups[button.dataset.selectGroup].forEach((code) => state.selectedCodes.add(code));
        updateCheckboxes();
      });

      elements.colorChecks.addEventListener('change', (event) => {
        const checkbox = event.target.closest('[data-color-checkbox]');
        if (!checkbox) return;
        if (checkbox.checked) state.selectedCodes.add(checkbox.value);
        else state.selectedCodes.delete(checkbox.value);
        renderSelectedCount();
      });

      elements.selectAll.addEventListener('click', () => {
        state.selectedCodes = new Set(APP_CONFIG.colors.map(({ code }) => code));
        updateCheckboxes();
      });

      elements.clearSelection.addEventListener('click', () => {
        state.selectedCodes.clear();
        updateCheckboxes();
      });

      elements.purchaseForm.addEventListener('submit', (event) => {
        event.preventDefault();
        if (state.storageLocked) {
          setMessage(elements.purchaseMessage, '请先导入备份或清空无法读取的本地数据');
          return;
        }
        try {
          const selected = [...state.selectedCodes];
          InventoryCore.addStock(
            state.inventory,
            selected,
            elements.purchaseQuantity.value
          );
          const amount = Number(elements.purchaseQuantity.value);
          const items = Object.fromEntries(selected.map((code) => [code, amount]));
          const transaction = createAppTransaction('purchase', '采购入库', items);
          const candidate = LedgerCore.appendTransaction(state.warehouse, transaction, APP_CONFIG);
          if (commitWarehouse(candidate, `已为 ${selected.length} 个色号各入库 ${amount} 颗`, elements.purchaseMessage)) {
            state.selectedCodes.clear();
            elements.purchaseQuantity.value = '';
            updateCheckboxes();
            setMessage(elements.purchaseMessage);
          }
        } catch (error) {
          setMessage(elements.purchaseMessage, error.message);
        }
      });

      elements.saveThreshold.addEventListener('click', () => {
        try {
          const raw = elements.lowStockThreshold.value.trim();
          if (!/^\d+$/.test(raw)) throw new Error('库存预警阈值必须是非负整数');
          const threshold = Number(raw);
          if (!Number.isSafeInteger(threshold) || threshold < 0) {
            throw new Error('库存预警阈值必须是非负安全整数');
          }
          const candidate = {
            ...state.warehouse,
            settings: { ...state.warehouse.settings, lowStockThreshold: threshold }
          };
          if (commitWarehouse(candidate, '库存预警阈值已保存', elements.dataMessage)) {
            setMessage(elements.dataMessage, '库存预警阈值已保存', { error: false });
          }
        } catch (error) {
          setMessage(elements.dataMessage, error.message);
        }
      });

      elements.syncStatus.addEventListener('click', () => {
        elements.dataPanel.open = true;
        elements.dataPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });

      elements.testSync.addEventListener('click', async () => {
        setMessage(elements.syncMessage, '', { error: false });
        elements.testSync.disabled = true;
        elements.testSync.textContent = '测试中...';
        try {
          const client = new GitHubClient(syncFormConfig());
          await client.testConnection();
          setMessage(elements.syncMessage, '连接成功', { error: false });
        } catch (error) {
          setMessage(elements.syncMessage, syncErrorMessage(error));
        } finally {
          elements.testSync.disabled = false;
          elements.testSync.textContent = '测试连接';
        }
      });

      elements.saveSync.addEventListener('click', () => {
        try {
          syncManager.configure(syncFormConfig());
          renderSyncConfig();
          setMessage(elements.syncMessage, '同步设置已保存', { error: false });
          clearTimeout(syncTimer);
          syncTimer = setTimeout(() => syncManager.syncNow().catch(() => {}), 700);
        } catch (error) {
          setMessage(elements.syncMessage, syncErrorMessage(error));
        }
      });

      elements.syncNow.addEventListener('click', async () => {
        clearTimeout(syncTimer);
        elements.syncNow.disabled = true;
        try {
          await syncManager.syncNow();
        } catch (error) {
          setMessage(elements.syncMessage, syncErrorMessage(error));
        } finally {
          elements.syncNow.disabled = false;
        }
      });

      elements.disconnectSync.addEventListener('click', () => {
        syncManager.disconnect();
        clearTimeout(syncTimer);
        renderSyncConfig();
        setMessage(elements.syncMessage, '此设备已断开同步', { error: false });
      });

      elements.firstSyncDialog.addEventListener('click', (event) => {
        const button = event.target.closest('[data-first-sync-choice]');
        if (!button || !firstSyncResolver) return;
        const choice = button.dataset.firstSyncChoice;
        if (choice === 'cloud') {
          try {
            localStorage.setItem(APP_CONFIG.recoveryStorageKey, JSON.stringify(firstSyncPayload.local));
          } catch (error) {
            setMessage(elements.syncMessage, `无法保存本地恢复副本：${error.message}`);
            return;
          }
        }
        const resolve = firstSyncResolver;
        firstSyncResolver = null;
        firstSyncPayload = null;
        elements.firstSyncDialog.close();
        resolve(choice);
      });

      elements.syncConflictForm.addEventListener('submit', (event) => {
        event.preventDefault();
        if (!conflictResolver) return;
        const choices = {};
        elements.syncConflictList.querySelectorAll('.conflict-row').forEach((row) => {
          choices[row.dataset.conflictKey] = row.querySelector('select').value;
        });
        const resolve = conflictResolver;
        conflictResolver = null;
        elements.syncConflictDialog.close();
        resolve(choices);
      });

      elements.cancelConflicts.addEventListener('click', () => {
        if (!conflictResolver) return;
        const resolve = conflictResolver;
        conflictResolver = null;
        elements.syncConflictDialog.close();
        resolve(null);
      });

      window.addEventListener('online', () => {
        if (syncManager?.syncConfig?.pending) syncManager.syncNow().catch(() => {});
      });
      window.addEventListener('offline', () => {
        if (syncManager?.syncConfig) {
          setSyncStatus({ state: 'offline', message: '离线，等待同步' });
        }
      });

      elements.exportBackup.addEventListener('click', () => {
        try {
          const blob = new Blob([JSON.stringify(state.warehouse, null, 2)], { type: 'application/json;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          const date = new Date().toISOString().slice(0, 10);
          link.href = url;
          link.download = `拼豆库存备份-${date}.json`;
          document.body.append(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 0);
          setMessage(elements.dataMessage);
          showToast('备份已导出');
        } catch (error) {
          setMessage(elements.dataMessage, `导出失败：${error.message}`);
        }
      });

      elements.importFile.addEventListener('change', async () => {
        const [file] = elements.importFile.files;
        if (!file) return;
        try {
          const text = await file.text();
          let data;
          try {
            data = JSON.parse(text);
          } catch {
            throw new Error('备份文件不是有效的 JSON');
          }
          let imported;
          if (data?.schemaVersion === LedgerCore.WAREHOUSE_SCHEMA_VERSION) {
            imported = LedgerCore.validateWarehouse(data, APP_CONFIG);
            const replayed = LedgerCore.replay(imported, APP_CONFIG);
            if (!replayed.ok) {
              const { code, occurredAt, missing } = replayed.failure;
              throw new Error(`${code} 在 ${occurredAt} 库存不足，还差 ${missing} 颗`);
            }
          } else {
            const now = nowIso();
            imported = LedgerCore.migrateV1(data, APP_CONFIG, state.deviceId, now, randomUuid);
          }
          if (!window.confirm('导入将覆盖当前库存和色系配置，是否继续？')) return;
          if (commitWarehouse(imported, '备份已恢复', elements.dataMessage)) {
            resetFiltersAfterSettingsChange();
            setMessage(elements.dataMessage);
          }
        } catch (error) {
          setMessage(elements.dataMessage, `导入失败：${error.message}`);
        } finally {
          elements.importFile.value = '';
        }
      });

      elements.clearInventory.addEventListener('click', () => {
        if (typeof elements.clearDialog.showModal === 'function') {
          elements.clearDialog.showModal();
        } else if (window.confirm('确认将全部 282 个色号库存清零？')) {
          clearInventoryWithHistory();
        }
      });

      elements.cancelClear.addEventListener('click', () => elements.clearDialog.close());

      elements.confirmClear.addEventListener('click', () => {
        if (clearInventoryWithHistory()) {
          elements.clearDialog.close();
          setMessage(elements.dataMessage);
        }
      });

      elements.clearDialog.addEventListener('click', (event) => {
        if (event.target === elements.clearDialog) elements.clearDialog.close();
      });

      renderGroupFilter();
      renderPurchaseGroups();
      renderHistoryCodeFilter();
      renderColorChecks();
      renderSettingsControls();
      resetUsageRows();
      setMutationLock(state.storageLocked);
      renderDashboard();
      renderInventory();
      renderHistory();
      initializeSync();
    })();
  </script>
</body>
</html>
